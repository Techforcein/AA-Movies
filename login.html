<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><h1>Login</h1><form id="form">
<input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required>
<button>Login</button></form><p id="msg"></p><p>New here? <a href="signup.html">Create account</a></p></main>
<script type="module">
import {auth,onAuthStateChanged,signInWithEmailAndPassword} from "./firebase.js";
onAuthStateChanged(auth,u=>{if(u) location.replace("M2.html")});
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Logging in...";
try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);location.replace("M2.html")}
catch(e){msg.textContent=e.code==="auth/invalid-credential"?"Incorrect email or password.":e.message}});
</script></body></html>
