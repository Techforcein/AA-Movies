<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 Protected Page</title><link rel="stylesheet" href="style.css">
<script type="module">import {auth,onAuthStateChanged} from "./firebase.js";
onAuthStateChanged(auth,u=>{if(!u) location.replace("login.html");else document.getElementById("email").textContent=u.email||""});</script></head>
<body><main class="card"><span class="badge">AUTHENTICATED</span><h1>M2 Protected Page</h1><p>You successfully logged in with Firebase.</p>
<div class="userbox"><b>Signed in as</b><span id="email">Checking...</span></div><button id="logout">Logout</button></main>
<script type="module">import {auth,signOut} from "./firebase.js";logout.onclick=async()=>{await signOut(auth);location.replace("login.html")};</script></body></html>
