<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>Create Account • AA Movies</title>

<link
    rel="icon"
    type="image/png"
    href="favicon-file_00000000e048820b91cd39ad4bd06335.png"
>


<style>

/* =========================================================
   GLOBAL
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    background: #000;

    color: #fff;

    font-family:
        Inter,
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {

    position: fixed;

    inset: 0;

    z-index: -10;

    background-image:
        url("https://cdn.marvel.com/content/1x/avengersdoomsday_lob_crd_03.webp");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    transform: scale(1.04);

    animation:
        backgroundZoom
        15s
        ease-in-out
        infinite
        alternate;
}


/*
   Dark overlay for readability.
   This does NOT blur the image.
*/

.background::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.60) 0%,
            rgba(0,0,0,.38) 35%,
            rgba(0,0,0,.65) 70%,
            rgba(0,0,0,.90) 100%
        );
}


/*
   Soft edge darkening.
   No blur.
*/

.background::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 15%,
            rgba(0,0,0,.55) 100%
        );
}


@keyframes backgroundZoom {

    from {
        transform: scale(1.04);
    }

    to {
        transform: scale(1.10);
    }

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {

    position: relative;

    z-index: 20;

    height: 75px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 clamp(20px,5vw,55px);
}


.logo {

    color: #fff;

    text-decoration: none;

    font-size:
        clamp(25px,4vw,34px);

    font-weight: 900;

    letter-spacing: -1.8px;
}


.logo span {

    color: #e50914;

    text-shadow:
        0 0 18px
        rgba(229,9,20,.45);
}


/* =========================================================
   LANGUAGE
========================================================= */

.language {

    padding:
        9px 13px;

    border:
        1px solid
        rgba(255,255,255,.28);

    border-radius: 6px;

    background:
        rgba(0,0,0,.55);

    color: #fff;

    outline: none;

    font-size: 13px;
}


.language option {

    background: #111;

    color: #fff;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

/*
   IMPORTANT:
   This is transparent.

   Therefore:
   - background remains visible
   - no black screen
   - no blur
*/

.loading-screen {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;

    justify-content: center;

    background: transparent;

    backdrop-filter: none;

    -webkit-backdrop-filter: none;

    opacity: 1;

    visibility: visible;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}


.loading-screen.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* =========================================================
   FOUR DOT CIRCULAR LOADER
========================================================= */

.loader {

    position: relative;

    width: 70px;

    height: 70px;
}


.dot {

    position: absolute;

    width: 10px;

    height: 10px;

    top: 30px;

    left: 30px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 12px
        rgba(255,255,255,.9);

    animation:
        circleMove
        1.2s
        linear
        infinite;
}


.dot:nth-child(1) {
    animation-delay: 0s;
}

.dot:nth-child(2) {
    animation-delay: -.3s;
}

.dot:nth-child(3) {
    animation-delay: -.6s;
}

.dot:nth-child(4) {
    animation-delay: -.9s;
}


@keyframes circleMove {

    0% {

        transform:
            rotate(0deg)
            translateX(25px);

        opacity: .35;
    }

    25% {
        opacity: 1;
    }

    50% {

        transform:
            rotate(180deg)
            translateX(25px);

        opacity: .35;
    }

    75% {
        opacity: 1;
    }

    100% {

        transform:
            rotate(360deg)
            translateX(25px);

        opacity: .35;
    }

}


/* =========================================================
   MAIN
========================================================= */

.signup-area {

    position: relative;

    z-index: 5;

    min-height:
        calc(100vh - 75px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding:
        25px 20px 60px;
}


/* =========================================================
   SIGNUP CARD
========================================================= */

.card {

    width:
        min(470px,100%);

    padding:
        38px 40px;

    border:
        1px solid
        rgba(255,255,255,.20);

    border-radius: 17px;

    /*
       TRANSPARENT GLASS EFFECT
    */

    background:
        rgba(0,0,0,.30);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,.65),

        0 0 45px
        rgba(0,0,0,.25);

    /*
       Slight glass effect on card only.
       The background image itself remains sharp.
    */

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(25px)
        scale(.98);
}


.card.show {

    visibility: visible;

    animation:
        cardAppear
        .65s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   TITLE
========================================================= */

.card h1 {

    font-size:
        clamp(30px,7vw,39px);

    line-height: 1.1;

    font-weight: 800;

    letter-spacing: -1.5px;

    margin-bottom: 9px;
}


.subtitle {

    color: #c0c0c0;

    font-size: 14px;

    line-height: 1.65;

    margin-bottom: 28px;
}


/* =========================================================
   INPUTS
========================================================= */

.field {

    margin-bottom: 17px;
}


.field label {

    display: block;

    color: #eee;

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 8px;
}


.input {

    width: 100%;

    height: 54px;

    padding:
        0 16px;

    border:
        1px solid
        rgba(255,255,255,.22);

    border-radius: 8px;

    outline: none;

    background:
        rgba(15,15,15,.65);

    color: #fff;

    font-family: inherit;

    font-size: 15px;

    transition:
        .25s ease;
}


.input::placeholder {

    color: #8a8a8a;
}


.input:focus {

    background:
        rgba(10,10,10,.78);

    border-color:
        rgba(229,9,20,.9);

    box-shadow:
        0 0 0 2px
        rgba(229,9,20,.12);
}


/* =========================================================
   MESSAGE
========================================================= */

#message {

    min-height: 20px;

    margin:
        0 0 10px;

    color: #ff5c64;

    font-size: 13px;

    line-height: 1.4;
}


#message.success {

    color: #58e58a;
}


/* =========================================================
   CREATE ACCOUNT BUTTON
========================================================= */

.signup-button {

    width: 100%;

    height: 54px;

    border: none;

    border-radius: 7px;

    background:
        #e50914;

    color: #fff;

    font-family: inherit;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    transition:
        .2s ease;

    box-shadow:
        0 8px 25px
        rgba(229,9,20,.20);
}


.signup-button:hover {

    background:
        #f20b18;

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 35px
        rgba(229,9,20,.35);
}


.signup-button:active {

    transform:
        scale(.98);
}


.signup-button:disabled {

    opacity: .65;

    cursor: wait;

    transform: none;
}


/* =========================================================
   SIGN IN
========================================================= */

.signin-area {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    margin-top: 22px;

    flex-wrap: wrap;

    text-align: center;
}


.signin-area span {

    color: #aaa;

    font-size: 13px;
}


.signin-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding:
        9px 18px;

    background:
        rgba(229,9,20,.90);

    color: #fff;

    border-radius: 6px;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;

    transition:
        .25s ease;

    box-shadow:
        0 6px 20px
        rgba(229,9,20,.25);
}


.signin-button:hover {

    background:
        #f20b18;

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 28px
        rgba(229,9,20,.40);
}


.signin-button:active {

    transform:
        scale(.97);
}


/* =========================================================
   FOOTER
========================================================= */

.footer-text {

    margin-top: 18px;

    text-align: center;

    color: #777;

    font-size: 10px;

    line-height: 1.6;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .navbar {

        height: 65px;

        padding:
            0 18px;
    }


    .logo {

        font-size: 27px;
    }


    .language {

        display: none;
    }


    .signup-area {

        min-height:
            calc(100vh - 65px);

        align-items:
            flex-start;

        padding:
            35px 18px 55px;
    }


    .card {

        padding:
            30px 23px;

        border-radius:
            15px;
    }


    .card h1 {

        font-size: 31px;
    }


    .subtitle {

        font-size: 13px;

        margin-bottom: 25px;
    }


    .input {

        height: 52px;
    }


    .signup-button {

        height: 53px;
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px) {

    .card {

        padding:
            27px 19px;
    }


    .card h1 {

        font-size: 28px;
    }


    .signin-area {

        gap: 7px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background"></div>


<!-- =======================================================
     NAVBAR
======================================================= -->

<header class="navbar">

    <a
        href="login.html"
        class="logo"
    >

        AA <span>Movies</span>

    </a>


    <select class="language">

        <option>
            English
        </option>

        <option>
            हिन्दी
        </option>

    </select>

</header>


<!-- =======================================================
     LOADING SCREEN
======================================================= -->

<div
    class="loading-screen"
    id="loadingScreen"
>

    <div class="loader">

        <div class="dot"></div>

        <div class="dot"></div>

        <div class="dot"></div>

        <div class="dot"></div>

    </div>

</div>


<!-- =======================================================
     SIGNUP CARD
======================================================= -->

<main class="signup-area">

    <section
        class="card"
        id="signupCard"
    >

        <h1>
            Create account
        </h1>


        <p class="subtitle">

            Join AA Movies and continue
            watching your favourite movies
            and shows.

        </p>


        <form id="signupForm">


            <!-- NAME -->

            <div class="field">

                <label for="nameInput">
                    Name
                </label>

                <input
                    class="input"
                    id="nameInput"
                    type="text"
                    placeholder="Name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="field">

                <label for="emailInput">
                    Email
                </label>

                <input
                    class="input"
                    id="emailInput"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="passwordInput">
                    Password
                </label>

                <input
                    class="input"
                    id="passwordInput"
                    type="password"
                    placeholder="Password (6+ characters)"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- MESSAGE -->

            <p id="message"></p>


            <!-- CREATE ACCOUNT -->

            <button
                class="signup-button"
                id="signupButton"
                type="submit"
            >

                Create account

            </button>


        </form>


        <!-- SIGN IN -->

        <div class="signin-area">

            <span>
                Already have an account?
            </span>


            <a
                href="login.html"
                class="signin-button"
            >

                Sign In

            </a>

        </div>


        <!-- FOOTER -->

        <p class="footer-text">

            By creating an account, you agree
            to use AA Movies responsibly.

            <br>

            © 2026 AA Movies

        </p>

    </section>

</main>


<!-- =======================================================
     3 SECOND LOADER
======================================================= -->

<script>

(function () {

    const loadingScreen =
        document.getElementById(
            "loadingScreen"
        );

    const signupCard =
        document.getElementById(
            "signupCard"
        );


    /*
       Keep background visible for exactly
       3 seconds while dots animate.
    */

    setTimeout(function () {

        loadingScreen.classList.add(
            "hide"
        );

        signupCard.classList.add(
            "show"
        );

    }, 3000);

})();

</script>


<!-- =======================================================
     FIREBASE SIGNUP
======================================================= -->

<script type="module">

import {

    auth,

    db,

    createUserWithEmailAndPassword,

    doc,

    setDoc,

    serverTimestamp

} from "./firebase.js";


/* =========================================================
   ELEMENTS
========================================================= */

const signupForm =
    document.getElementById(
        "signupForm"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );


const emailInput =
    document.getElementById(
        "emailInput"
    );


const passwordInput =
    document.getElementById(
        "passwordInput"
    );


const message =
    document.getElementById(
        "message"
    );


const signupButton =
    document.getElementById(
        "signupButton"
    );


/* =========================================================
   SIGNUP
========================================================= */

signupForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const name =
            nameInput.value.trim();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        message.className = "";

        message.textContent =
            "Creating account...";


        signupButton.disabled =
            true;

        signupButton.textContent =
            "Creating account...";


        try {


            /* ==============================================
               CREATE FIREBASE AUTH ACCOUNT
            ============================================== */

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "Firebase Auth account created:",
                result.user.uid
            );


            /* ==============================================
               SAVE USER DATA TO FIRESTORE

               We wait for this to finish so the profile
               is properly saved before redirecting.
            ============================================== */

            await setDoc(

                doc(
                    db,
                    "users",
                    result.user.uid
                ),

                {
                    name:
                        name,

                    email:
                        result.user.email,

                    createdAt:
                        serverTimestamp()
                }

            );


            console.log(
                "Firestore user profile saved."
            );


            /* ==============================================
               SUCCESS
            ============================================== */

            message.className =
                "success";


            message.textContent =
                "Account created successfully!";


            signupButton.textContent =
                "Account created ✓";


            /* ==============================================
               REDIRECT TO INDEX
            ============================================== */

            setTimeout(function () {

                window.location.replace(
                    "index.html"
                );

            }, 300);


        }

        catch (error) {

            console.error(
                "Signup error:",
                error
            );


            signupButton.disabled =
                false;


            signupButton.textContent =
                "Create account";


            /* ==============================================
               FIREBASE ERRORS
            ============================================== */

            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                message.textContent =
                    "This email is already registered.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                message.textContent =
                    "Password must contain at least 6 characters.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.textContent =
                    "Please enter a valid email.";

            }

            else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                message.textContent =
                    "Email/password authentication is not enabled.";

            }

            else if (
                error.code ===
                "permission-denied"
            ) {

                message.textContent =
                    "Account created, but your profile could not be saved.";

            }

            else {

                message.textContent =
                    error.message ||
                    "Unable to create account.";

            }

        }

    }
);

</script>


</body>

</html>
