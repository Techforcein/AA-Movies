<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><h1>Create account</h1><form id="form">
<input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" minlength="6" placeholder="Password (6+ characters)" required>
<button>Create account</button></form><p id="msg"></p><p>Already have an account? <a href="login.html">Login</a></p></main>
<script type="module">
import {auth,db,createUserWithEmailAndPassword,doc,setDoc,serverTimestamp} from "./firebase.js";
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Creating account...";
try{const r=await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);
await setDoc(doc(db,"users",r.user.uid),{name:name.value.trim(),email:r.user.email,createdAt:serverTimestamp()});
location.replace("M2.html")}catch(e){msg.textContent=e.code==="auth/email-already-in-use"?"Email already registered.":e.message}});
</script></body></html>
